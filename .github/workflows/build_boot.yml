name: Build kernel Binaries

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target device codename (x1q, y2q, z3q ,c1q , c2q)"
        required: true
        default: "y2q"
      release:
        description: "Upload release"
        type: boolean
        required: true
        default: false
      changelog:
        description: "Changelog"
        type: string
        required: false

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # 1. Checkout repository with submodules (shallow clone)
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            python3 adb zip curl xz-utils \
            llvm lld dwarves git unzip wget zstd jq ccache

      - name: Download latest Google clang
        run: |
          wget -O llvm.tar.zst https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          mkdir llvm-21; cd llvm-21
          tar -I unzstd -xf ../llvm.tar.zst
          rm ../llvm.tar.zst
          cd ..

      # 2. Run your custom boot build script
      - name: Build kernel (boot)
        run: |
          chmod +x build_boot.sh
          ./build_boot.sh ${{ github.event.inputs.device }}

      - name: Generate release version
        id: ts
        run: |
          echo "RELEASE_TS=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
          : > version.txt
          echo "**Kernel version:** $(cat out/include/config/kernel.release)  " >> version.txt
          echo >> version.txt
          export KHASH="$(git rev-parse HEAD)"
          echo "**Kernel source:** [$KHASH](https://github.com/AstroByteX-Code/android_kernel_samsung_sm8250/tree/$KHASH)" >> version.txt

          if [ "${{ github.event.inputs.release }}" = "true" ] && \
             [ -n "${{ github.event.inputs.changelog }}" ]; then
            echo >> version.txt
            echo "**Changelog:**" >> version.txt
            echo >> version.txt
            printf "%b\n" "${{ github.event.inputs.changelog }}" >> version.txt
          fi

      # 3. Ensure artifacts exist
      - name: Ensure artifacts exist
        run: |
          test -f boot.img || (echo "boot.img missing" && exit 1)
          test -f dtbo.img || (echo "dtbo.img missing" && exit 1)

      # 4. Upload the generated boot.img + dtbo.img
      - name: Upload release assets
        if: github.event.inputs.release
        uses: softprops/action-gh-release@v2.4.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: version.txt
          tag_name: "${{ env.RELEASE_TS }}"
          name: "ASTRO-${{ github.event.inputs.device}}-${{ env.RELEASE_TS }}"
          files: |
            boot.img
            dtbo.img
