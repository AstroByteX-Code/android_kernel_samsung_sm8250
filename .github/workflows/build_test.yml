name: Build Test Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [ y2q ]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive   # ensures Baseband-guard submodule is pulled

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            dwarves \
            flex \
            git \
            gawk \
            libelf-dev \
            libssl-dev \
            python3 \
            unzip \
            wget \
            zip \
            zstd

      - name: Download latest Google clang
        run: |
          wget -O llvm.tar.zst https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          mkdir llvm-21; cd llvm-21
          tar -I unzstd -xf ../llvm.tar.zst
          rm ../llvm.tar.zst
          cd ..

      - name: Patch CONFIG_LSM for Baseband-guard
        run: |
          # Inject baseband_guard into CONFIG_LSM defaults
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          echo "✅ CONFIG_LSM patched to include baseband_guard"

      - name: Verify CONFIG_BBG and CONFIG_LSM
        run: |
          # Show defconfig entries
          grep CONFIG_BBG arch/arm64/configs/vendor/kona-sec-perf_defconfig || echo "⚠️ CONFIG_BBG not found in defconfig"
          grep CONFIG_LSM security/Kconfig || echo "⚠️ CONFIG_LSM not patched correctly"

      - name: Build kernel
        run: |
          chmod +x build_test.sh
          bash build_test.sh "${{ matrix.device }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Kernel-${{ matrix.device }}
          path: "*.zip"
